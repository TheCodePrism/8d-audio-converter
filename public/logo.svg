<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <!-- Primary 8D Gradient -->
    <linearGradient id="spatialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Backdrop -->
  <circle cx="64" cy="64" r="56" fill="url(#bgGlow)" />

  <!-- Outer 360° Inclined Orbit Ring (HRTF Sphere) -->
  <ellipse cx="64" cy="64" rx="46" ry="18" transform="rotate(-28 64 64)" stroke="url(#spatialGrad)" stroke-width="2.5" stroke-dasharray="1 3" opacity="0.45" />

  <!-- Secondary Counter Orbit Ring -->
  <ellipse cx="64" cy="64" rx="46" ry="18" transform="rotate(32 64 64)" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.45" />

  <!-- Orbiting Spatial Sound Nodes -->
  <circle cx="98" cy="46" r="3.5" fill="#22d3ee" filter="url(#neonGlow)" />
  <circle cx="30" cy="82" r="2.5" fill="#c084fc" filter="url(#neonGlow)" />

  <!-- Central Headphone Arch / 8D Infinity Arc -->
  <path d="M 38 66 C 38 42, 90 42, 90 66" stroke="url(#spatialGrad)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#neonGlow)" />

  <!-- Left Ear Cup / Binaural Capsule -->
  <rect x="32" y="60" width="12" height="22" rx="6" fill="#0f172a" stroke="url(#spatialGrad)" stroke-width="2.5" />
  <rect x="35" y="64" width="6" height="14" rx="3" fill="#22d3ee" opacity="0.8" />

  <!-- Right Ear Cup / Binaural Capsule -->
  <rect x="84" y="60" width="12" height="22" rx="6" fill="#0f172a" stroke="url(#spatialGrad)" stroke-width="2.5" />
  <rect x="87" y="64" width="6" height="14" rx="3" fill="#a855f7" opacity="0.8" />

  <!-- Core Pulsing Sound Sphere (Spatial Center) -->
  <circle cx="64" cy="66" r="6" fill="url(#spatialGrad)" filter="url(#neonGlow)" />
  <circle cx="64" cy="66" r="2.5" fill="#ffffff" />

  <!-- Binaural Wave Arcs -->
  <path d="M 54 62 C 52 64, 52 68, 54 70" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75" />
  <path d="M 74 62 C 76 64, 76 68, 74 70" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75" />
</svg>
